<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Integrated Warehouse Management System preview</title>
  <desc id="desc">A conceptual product preview showing inventory metrics, warehouse records, and an approval workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0F2744"/>
      <stop offset="1" stop-color="#123B66"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#38A3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020817" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="-20" r="260" fill="#1677FF" opacity="0.12"/>
  <circle cx="80" cy="660" r="300" fill="#F5A800" opacity="0.08"/>

  <g transform="translate(64 58)">
    <rect width="54" height="54" rx="16" fill="#F5A800"/>
    <path d="M15 37V17h24v20M21 37V24h12v13M13 39h28" fill="none" stroke="#0F2744" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="23" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700">Integrated Warehouse Management</text>
    <text x="72" y="48" fill="#9FB4CB" font-family="Arial, sans-serif" font-size="14">Inventory, fixed assets, projects and approval workflows</text>
  </g>

  <g transform="translate(64 148)" filter="url(#shadow)">
    <rect width="1072" height="420" rx="25" fill="#F7FAFD"/>
    <rect width="220" height="420" rx="25" fill="#FFFFFF"/>
    <rect x="18" y="28" width="184" height="48" rx="14" fill="#EAF3FF"/>
    <circle cx="48" cy="52" r="12" fill="#1677FF"/>
    <text x="72" y="58" fill="#1677FF" font-family="Arial, sans-serif" font-size="15" font-weight="700">Dashboard</text>
    <g fill="#64748B" font-family="Arial, sans-serif" font-size="14">
      <text x="32" y="116">Items &amp; Categories</text>
      <text x="32" y="156">Inventory</text>
      <text x="32" y="196">Receipts</text>
      <text x="32" y="236">Consumption</text>
      <text x="32" y="276">Transfers</text>
      <text x="32" y="316">Fixed Assets</text>
      <text x="32" y="356">Projects &amp; Reviews</text>
    </g>
    <line x1="220" y1="0" x2="220" y2="420" stroke="#E2E8F0"/>

    <text x="258" y="49" fill="#0F2744" font-family="Arial, sans-serif" font-size="19" font-weight="700">Operations overview</text>
    <text x="258" y="72" fill="#7890A8" font-family="Arial, sans-serif" font-size="12">Live warehouse and project activity</text>

    <g transform="translate(258 94)">
      <g><rect width="185" height="82" rx="16" fill="#FFFFFF" stroke="#E3EBF4"/><circle cx="32" cy="30" r="17" fill="#EAF3FF"/><text x="60" y="29" fill="#64748B" font-family="Arial" font-size="11">Catalog items</text><text x="60" y="57" fill="#0F2744" font-family="Arial" font-size="24" font-weight="700">1,248</text></g>
      <g transform="translate(200)"><rect width="185" height="82" rx="16" fill="#FFFFFF" stroke="#E3EBF4"/><circle cx="32" cy="30" r="17" fill="#EAF8F2"/><text x="60" y="29" fill="#64748B" font-family="Arial" font-size="11">Available stock</text><text x="60" y="57" fill="#0F2744" font-family="Arial" font-size="24" font-weight="700">86%</text></g>
      <g transform="translate(400)"><rect width="185" height="82" rx="16" fill="#FFFFFF" stroke="#E3EBF4"/><circle cx="32" cy="30" r="17" fill="#FFF7E6"/><text x="60" y="29" fill="#64748B" font-family="Arial" font-size="11">Fixed assets</text><text x="60" y="57" fill="#0F2744" font-family="Arial" font-size="24" font-weight="700">376</text></g>
      <g transform="translate(600)"><rect width="176" height="82" rx="16" fill="#FFFFFF" stroke="#E3EBF4"/><circle cx="32" cy="30" r="17" fill="#FDECEC"/><text x="60" y="29" fill="#64748B" font-family="Arial" font-size="11">Pending reviews</text><text x="60" y="57" fill="#0F2744" font-family="Arial" font-size="24" font-weight="700">12</text></g>
    </g>

    <g transform="translate(258 198)">
      <rect width="510" height="185" rx="18" fill="#FFFFFF" stroke="#E3EBF4"/>
      <text x="20" y="31" fill="#0F2744" font-family="Arial" font-size="14" font-weight="700">Inventory by warehouse</text>
      <g fill="#7890A8" font-family="Arial" font-size="10"><text x="20" y="61">ITEM</text><text x="255" y="61">WAREHOUSE</text><text x="420" y="61">STOCK</text></g>
      <line x1="20" y1="72" x2="490" y2="72" stroke="#EEF2F6"/>
      <g font-family="Arial" font-size="11" fill="#334155">
        <text x="20" y="98">Steel rebar 16mm</text><text x="255" y="98">Central</text><text x="420" y="98" fill="#16A36A" font-weight="700">24.5 t</text>
        <text x="20" y="130">Cement type II</text><text x="255" y="130">Project A</text><text x="420" y="130" fill="#16A36A" font-weight="700">680 bag</text>
        <text x="20" y="162">Industrial pump</text><text x="255" y="162">Project B</text><text x="420" y="162" fill="#1677FF" font-weight="700">3 asset</text>
      </g>
    </g>

    <g transform="translate(788 198)">
      <rect width="310" height="185" rx="18" fill="#FFFFFF" stroke="#E3EBF4"/>
      <text x="20" y="31" fill="#0F2744" font-family="Arial" font-size="14" font-weight="700">Approval workflow</text>
      <line x1="36" y1="59" x2="36" y2="151" stroke="#D9E8FF" stroke-width="3"/>
      <circle cx="36" cy="68" r="9" fill="#16A36A"/><circle cx="36" cy="109" r="9" fill="#1677FF"/><circle cx="36" cy="150" r="9" fill="#CBD5E1"/>
      <g font-family="Arial"><text x="58" y="72" fill="#334155" font-size="12" font-weight="700">Receipt registered</text><text x="58" y="113" fill="#334155" font-size="12" font-weight="700">Technical review</text><text x="58" y="154" fill="#64748B" font-size="12">Final confirmation</text></g>
      <rect x="194" y="92" width="94" height="34" rx="10" fill="url(#blue)"/><text x="241" y="114" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="700">Review now</text>
    </g>
  </g>

  <text x="64" y="604" fill="#7890A8" font-family="Arial, sans-serif" font-size="12">PRIVATE PRODUCT PREVIEW · SOURCE CODE AND CUSTOMER DATA ARE NOT PUBLIC</text>
</svg>
